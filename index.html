<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14332A">
<title>Yaye MBAY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --dark:#14332A; --dark-2:#1F4A3B; --cream:#FBF6EA; --beige:#F3EAD3; --sand:#EADFC6;
  --green:#25773F; --green-2:#4FAA6A; --green-3:#8CC48F; --green-4:#DDEFD9;
  --yellow:#F2B632; --yellow-2:#FCEFC9; --rust:#B84A12; --orange:#E8742C; --rust-2:#F8E1D3;
  --ochre:#C98E12; --ink:#1E2B25; --muted:#5F6B63; --white:#fff; --danger:#C2361B;
  --r-s:12px; --r-m:18px; --r-l:26px;
  --shadow:0 1px 2px rgba(20,51,42,.06),0 6px 20px rgba(20,51,42,.08);
  --nav-h:72px;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--beige);color:var(--ink);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea{font:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- App shell ---------- */
.app{max-width:440px;margin:0 auto;min-height:100dvh;background:var(--cream);position:relative;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 12px)}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 12px;background:rgba(251,246,234,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.topbar .brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{width:36px;height:36px;border-radius:11px;background:var(--dark);display:grid;place-items:center;flex:none}
.brand h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em;color:var(--dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--white);box-shadow:var(--shadow);position:relative;flex:none}
.icon-btn .dot{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--rust);border:2px solid var(--white)}
.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--white);box-shadow:var(--shadow);flex:none}

main{padding:4px 18px 8px}
.screen{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Typography / sections ---------- */
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--rust);margin:0 0 4px}
.h2{font-size:24px;line-height:1.15;font-weight:800;letter-spacing:-.02em;color:var(--dark);margin:0}
.section{margin-top:26px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.section-head h3{margin:0;font-size:17px;font-weight:800;color:var(--dark)}
.link{color:var(--green);font-weight:700;font-size:13.5px}
.muted{color:var(--muted)}

/* ---------- Cards ---------- */
.card{background:var(--white);border-radius:var(--r-m);box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--green-4);color:var(--green)}
.pill.soif{background:var(--rust-2);color:var(--danger)}
.pill.trop{background:#DCEBF7;color:#1F5F8B}
.pill.info{background:var(--yellow-2);color:#7A5600}

/* Hero */
.hero{position:relative;border-radius:var(--r-l);overflow:hidden;min-height:210px;color:var(--white);margin-top:6px}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,51,42,.05) 20%,rgba(20,51,42,.88) 100%)}
.hero-body{position:relative;z-index:1;padding:20px;display:flex;flex-direction:column;justify-content:flex-end;min-height:210px}
.hero-body p{margin:0;font-size:13px;font-weight:600;opacity:.9}
.hero-body h2{margin:4px 0 10px;font-size:25px;line-height:1.12;font-weight:800;letter-spacing:-.02em}
.weather{display:flex;gap:8px;flex-wrap:wrap}
.weather span{background:rgba(255,255,255,.18);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:5px 10px;border-radius:99px;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:5px}

/* Alert */
.alert{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:16px;border-radius:var(--r-m);background:var(--dark);color:var(--cream);margin-top:14px}
.alert .ic{width:46px;height:46px;border-radius:14px;background:var(--rust);display:grid;place-items:center}
.alert h4{margin:0 0 3px;font-size:16px}
.alert p{margin:0;font-size:13.5px;opacity:.88}
.alert .actions{grid-column:1/-1;display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:99px;font-weight:700;font-size:14.5px;transition:transform .1s ease,background .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--yellow);color:var(--dark)}
.btn.green{background:var(--green);color:var(--white)}
.btn.ghost{background:rgba(255,255,255,.12);color:var(--cream)}
.btn.outline{background:var(--white);color:var(--dark);box-shadow:inset 0 0 0 1.5px var(--sand)}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;pointer-events:none}

/* Tasks */
.tasks{padding:6px 4px}
.task{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;width:100%;text-align:left}
.task + .task{border-top:1px solid #F1EADB;border-radius:0}
.check{width:26px;height:26px;border-radius:9px;border:2px solid var(--sand);display:grid;place-items:center;flex:none;transition:.2s}
.task[aria-checked="true"] .check{background:var(--green);border-color:var(--green)}
.task[aria-checked="true"] .t-title{text-decoration:line-through;color:var(--muted)}
.t-title{font-weight:700;font-size:14.5px}
.t-sub{font-size:12.5px;color:var(--muted)}
.progress{height:8px;border-radius:99px;background:#EFE7D4;overflow:hidden}
.progress > i{display:block;height:100%;border-radius:inherit;background:var(--green-2)}

/* Horizontal scroller */
.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:2px 18px 10px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.mini{flex:0 0 152px;scroll-snap-align:start;text-align:left;overflow:hidden}
.mini img{height:104px;width:100%;object-fit:cover}
.mini .b{padding:10px 12px 12px}
.mini b{display:block;font-size:14.5px;color:var(--dark)}
.meter{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin-top:6px;font-weight:600}

/* Event card */
.event{display:grid;grid-template-columns:62px 1fr;gap:14px;padding:14px;align-items:center}
.date{border-radius:14px;background:var(--beige);text-align:center;padding:8px 4px;line-height:1.1}
.date b{display:block;font-size:22px;color:var(--dark)}
.date span{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--rust)}
.event h4{margin:0 0 2px;font-size:15px;color:var(--dark)}
.event p{margin:0;font-size:12.5px;color:var(--muted)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{padding:14px}
.stat b{display:block;font-size:24px;font-weight:800;color:var(--dark);letter-spacing:-.02em}
.stat span{font-size:12.5px;color:var(--muted);font-weight:600}
.stat.dark{background:var(--dark)}
.stat.dark b{color:var(--yellow)} .stat.dark span{color:#C9D6CF}

/* ---------- Garden ---------- */
.seg{display:flex;gap:8px;overflow-x:auto;margin:14px -18px 4px;padding:0 18px 4px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{min-height:38px;padding:0 14px;border-radius:99px;background:var(--white);box-shadow:inset 0 0 0 1.5px var(--sand);font-weight:700;font-size:13.5px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--dark);color:var(--cream);box-shadow:none}
.plant{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:12px;text-align:left;width:100%;margin-top:12px}
.plant img{width:96px;height:112px;border-radius:14px;object-fit:cover}
.plant .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.plant h4{margin:0;font-size:16px;color:var(--dark)}
.plant .var{font-size:12.5px;color:var(--muted)}
.readings{display:flex;gap:12px;margin:8px 0;font-size:12.5px;font-weight:700;color:var(--ink)}
.readings span{display:inline-flex;align-items:center;gap:4px}
.harvest{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:5px;font-weight:600}

.kit{display:flex;gap:12px;align-items:center;padding:14px;margin-top:14px;background:var(--dark);color:var(--cream)}
.kit .led{width:14px;height:14px;border-radius:50%;background:#3FD06A;box-shadow:0 0 0 5px rgba(63,208,106,.2);flex:none}
.kit b{font-size:14.5px} .kit small{display:block;color:#C9D6CF;font-size:12px}

/* ---------- Sheet ---------- */
.backdrop{position:fixed;inset:0;background:rgba(20,51,42,.45);z-index:40;animation:fadein .2s}
@keyframes fadein{from{opacity:0}}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:440px;max-height:88dvh;overflow-y:auto;background:var(--cream);border-radius:26px 26px 0 0;z-index:41;padding:10px 18px calc(24px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translate(-50%,100%)}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--sand);margin:0 auto 12px}
.sheet .close{position:absolute;right:14px;top:14px}
.sheet-hero{border-radius:20px;height:190px;width:100%;object-fit:cover;margin-bottom:14px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.kv div{background:var(--white);border-radius:14px;padding:10px;text-align:center;box-shadow:var(--shadow)}
.kv b{display:block;font-size:19px;color:var(--dark)} .kv span{font-size:11.5px;color:var(--muted);font-weight:700}
.advice{background:var(--yellow-2);border-radius:16px;padding:14px;font-size:14px;display:flex;gap:10px}
.chart{background:var(--white);border-radius:16px;padding:14px;margin-top:12px;box-shadow:var(--shadow)}
.chart h5{margin:0 0 8px;font-size:13.5px;color:var(--dark)}
.journal{list-style:none;margin:12px 0 0;padding:0}
.journal li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #EFE7D4;font-size:13.5px}
.journal time{flex:none;width:64px;color:var(--muted);font-weight:700;font-size:12px}

/* ---------- Chat ---------- */
.chat-wrap{display:flex;flex-direction:column;min-height:calc(100dvh - 210px)}
.coach-head{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-top:4px}
.coach-head .bot{width:44px;height:44px;border-radius:14px;background:var(--green);display:grid;place-items:center;flex:none}
.coach-head b{display:block;color:var(--dark)} .coach-head small{color:var(--green);font-weight:700;font-size:12px}
.lang{margin-left:auto;display:flex;background:var(--beige);border-radius:99px;padding:3px}
.lang button{min-height:32px;padding:0 12px;border-radius:99px;font-size:12.5px;font-weight:800;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--white);color:var(--dark);box-shadow:var(--shadow)}
.msgs{display:flex;flex-direction:column;gap:8px;padding:16px 2px 8px;flex:1}
.day{align-self:center;font-size:11.5px;font-weight:700;color:var(--muted);background:var(--beige);padding:4px 10px;border-radius:99px;margin:6px 0}
.msg{max-width:82%;padding:10px 13px;border-radius:18px;font-size:14.5px;line-height:1.4;position:relative;animation:fade .2s}
.msg time{display:block;font-size:10.5px;opacity:.6;margin-top:3px;text-align:right}
.msg.me{align-self:flex-end;background:#CDEAC6;border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--white);border-bottom-left-radius:6px;box-shadow:var(--shadow)}
.msg img{border-radius:12px;margin-bottom:6px;width:220px;max-width:100%;height:150px;object-fit:cover}
.msg ol,.msg ul{margin:6px 0 0;padding-left:18px}
.diag{margin-top:8px;padding:10px;border-radius:12px;background:var(--rust-2)}
.diag b{color:var(--danger)}
.conf{height:6px;background:#fff;border-radius:9px;margin-top:6px;overflow:hidden}.conf i{display:block;height:100%;background:var(--rust)}
.voice{display:inline-flex;align-items:center;gap:8px;margin-top:8px;background:var(--green-4);color:var(--green);border-radius:99px;padding:6px 12px 6px 6px;font-size:12.5px;font-weight:800}
.voice .play{width:26px;height:26px;border-radius:50%;background:var(--green);display:grid;place-items:center}
.wave{display:inline-flex;gap:2px;align-items:center}.wave i{width:3px;border-radius:2px;background:var(--green-2)}
.typing{display:inline-flex;gap:4px;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--green-3);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -18px;padding:6px 18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 13px;border-radius:99px;background:var(--white);box-shadow:inset 0 0 0 1.5px var(--sand);font-size:13px;font-weight:700;color:var(--dark)}
.composer{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 8px);display:flex;gap:8px;align-items:center;background:var(--white);border-radius:99px;padding:6px;box-shadow:0 8px 30px rgba(20,51,42,.16);margin-top:8px}
.composer input[type=text]{flex:1;min-width:0;border:0;outline:0;background:none;padding:0 8px;font-size:15px;height:42px}
.composer .round{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
.composer .send{background:var(--green);color:var(--white)}
.composer .cam{background:var(--beige)}

/* ---------- Ateliers ---------- */
.workshop{overflow:hidden;margin-top:14px}
.workshop img{height:140px;width:100%;object-fit:cover}
.workshop .b{padding:14px}
.workshop h4{margin:6px 0 4px;font-size:17px;color:var(--dark)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);font-weight:600;margin:6px 0 12px}
.meta span{display:inline-flex;align-items:center;gap:5px}
.seats{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:12.5px;font-weight:700;color:var(--muted)}
.seats .progress{flex:1}
.for{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}

/* ---------- Marché ---------- */
.sales{padding:16px;background:var(--dark);color:var(--cream);margin-top:12px}
.sales .row{display:flex;justify-content:space-between;font-size:13.5px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.sales .row:last-child{border:0}
.sales .big{font-size:28px;font-weight:800;color:var(--yellow);letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}
.product{overflow:hidden;display:flex;flex-direction:column}
.product img{height:118px;width:100%;object-fit:cover}
.product .b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.product b{font-size:14px;color:var(--dark);line-height:1.25}
.product small{color:var(--muted);font-size:12px}
.product .price{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px;margin-top:auto;padding-top:8px}
.price strong{font-size:15px;color:var(--rust);white-space:nowrap}
.add{width:36px;height:36px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center}
.qty{display:flex;align-items:center;gap:6px;background:var(--green-4);border-radius:99px;padding:3px}
.qty button{width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:800;color:var(--green)}
.qty span{min-width:14px;text-align:center;font-weight:800;color:var(--green)}
.cartbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 10px);width:calc(100% - 36px);max-width:404px;z-index:25;display:flex;align-items:center;justify-content:space-between;background:var(--yellow);color:var(--dark);border-radius:18px;padding:12px 16px;font-weight:800;box-shadow:0 10px 30px rgba(20,51,42,.25);animation:fade .2s}
.radio{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--sand);margin-top:8px;cursor:pointer}
.radio:has(input:checked){box-shadow:inset 0 0 0 2px var(--green);background:var(--green-4)}
.radio input{accent-color:var(--green);width:18px;height:18px}
.line{display:flex;justify-content:space-between;padding:8px 0;font-size:14px;border-bottom:1px solid #EFE7D4}

/* ---------- Profil ---------- */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{padding:12px 6px;text-align:center;font-size:12px;font-weight:700;color:var(--dark)}
.badge .medal{width:48px;height:48px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:var(--yellow-2)}
.badge.locked{opacity:.45;filter:grayscale(1)}

/* ---------- Bottom nav ---------- */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:440px;z-index:30;background:var(--white);border-top:1px solid #EFE7D4;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);border-radius:14px}
.nav button[aria-current="page"]{color:var(--dark)}
.nav button[aria-current="page"] .ni{background:var(--green-4);color:var(--green)}
.ni{width:46px;height:30px;border-radius:99px;display:grid;place-items:center;transition:.2s}
.nav .coach .ni{width:54px;height:54px;border-radius:18px;background:var(--dark);color:var(--yellow);margin-top:-26px;box-shadow:0 8px 20px rgba(20,51,42,.3)}
.nav .coach[aria-current="page"] .ni{background:var(--green);color:#fff}

.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 14px);z-index:60;background:var(--dark);color:var(--cream);padding:12px 16px;border-radius:14px;font-weight:700;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px);animation:fade .2s}
.demo-note{font-size:11.5px;color:var(--muted);text-align:center;margin:28px 0 6px}

@media (min-width:600px){
  body{padding:24px 0}
  .app{border-radius:34px;box-shadow:0 30px 80px rgba(20,51,42,.25);min-height:calc(100dvh - 48px);overflow:clip}
  .nav{bottom:24px;border-radius:0 0 34px 34px}
  .cartbar{bottom:calc(var(--nav-h) + 34px)}
  .composer{bottom:calc(var(--nav-h) + 32px)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 21v-8" stroke="#8CC48F" stroke-width="2.4" stroke-linecap="round"/><path d="M12 13c0-4 3-6 7-6 0 4-3 6-7 6Z" fill="#4FAA6A"/><path d="M12 14c0-3.5-2.6-5.5-6.5-5.5 0 3.5 2.6 5.5 6.5 5.5Z" fill="#8CC48F"/><circle cx="18" cy="4.5" r="2.2" fill="#F2B632"/></svg></div>

function spark(vals, w = 300, h = 90) {
  const min = 0, max = 100, step = w / (vals.length - 1);
  const pts = vals.map((v, i) => [i * step, h - (v - min) / (max - min) * h]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const y30 = h - .30 * h, y70 = h - .70 * h;
  const days = ['ven.', 'sam.', 'dim.', 'lun.', 'mar.', 'mer.', 'jeu.'];
  return `<svg viewBox="0 -6 ${w} ${h + 26}" width="100%" role="img" aria-label="Humidité du sol sur 7 jours : ${vals.join(', ')} %">
    <rect x="0" y="${y70}" width="${w}" height="${y30 - y70}" fill="#DDEFD9" rx="4"/>
    <text x="${w - 4}" y="${y70 + 12}" text-anchor="end" font-size="10" fill="#25773F" font-weight="700">zone idéale 30–70 %</text>
    <path d="${d}" fill="none" stroke="#14332A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="${i === pts.length - 1 ? 5 : 3}" fill="${i === pts.length - 1 ? '#B84A12' : '#14332A'}"/>`).join('')}
    <text x="${pts.at(-1)[0] - 8}" y="${pts.at(-1)[1] - 10}" text-anchor="end" font-size="12" font-weight="800" fill="#B84A12">${vals.at(-1)} %</text>
    ${days.map((d, i) => `<text x="${Math.min(w - 12, Math.max(12, i * step))}" y="${h + 18}" text-anchor="middle" font-size="10" fill="#5F6B63">${i === 6 ? 'auj.' : d}</text>`).join('')}
  </svg>`;
}

/* =========================================================
   Coach IA (réponses simulées)
   ========================================================= */
function now() { return new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'}); }
function answer(q) {
  const s = q.toLowerCase();
  if (/(concentr|recette|transform)/.test(s)) return {html:`Voici la recette du concentré (pour 2 kg de tomates bien mûres) :<ol><li>Lave et coupe les tomates.</li><li>Fais cuire 20 min, puis passe-les au tamis.</li><li>Laisse réduire à feu doux 1 h 30 en remuant.</li><li>Ajoute 1 cuillère de sel, verse chaud dans des pots ébouillantés.</li></ol>Tu obtiens environ 3 pots de 200 g. Atelier le 21 nov au Foyer des femmes !`};
  if (/(piment|trop d.eau|trop humide)/.test(s)) return {text:'Ton piment est à 73 % d’humidité : c’est trop. N’arrose pas pendant 2 jours et vérifie que le seau a bien des trous en dessous. Je te dirai quand recommencer.'};
  if (/(récolt|recolt|cueill)/.test(s)) return {text:'La tomate sera prête dans 12 jours (vers le 19 novembre). Le gombo, dans 8 jours : cueille les gousses à 8–10 cm. Le bissap, début décembre.'};
  if (/(arros|eau|soif)/.test(s)) return {text:'Ce soir après 18 h : 2 verres d’eau pour la tomate. Pas d’eau pour le piment. Le gombo, le bissap, la menthe et les oignons vont bien, arrosage demain matin.'};
  if (/(novembre|planter|nouveau|semer)/.test(s)) return {text:'En novembre à Dakar, la saison fraîche commence : c’est le bon moment pour la laitue, la carotte, le chou et l’oignon. Je te conseille la laitue : récolte en 6 semaines, facile pour Fatou.'};
  if (/(jaune|feuille|malad|tache)/.test(s)) return {text:'Des feuilles jaunes en bas de la plante, c’est souvent la soif ou un manque d’engrais. Envoie-moi une photo de près, je regarde tout de suite.'};
  return {text:'Bonne question ! Envoie-moi une photo de la plante ou dis-moi laquelle (tomate, gombo, bissap, piment, menthe, oignon), et je te réponds.'};
}
function pushMsgs(...m) { state.chat.push(...m); const box = $('#msgs'); if (!box) return; box.insertAdjacentHTML('beforeend', m.map(msgHTML).join('')); hydrate(box); box.lastElementChild?.scrollIntoView({behavior:'smooth', block:'end'}); }
function botReply(reply, delay = 1100) {
  const box = $('#msgs');
  box.insertAdjacentHTML('beforeend', msgHTML({typing:true}));
  box.lastElementChild.scrollIntoView({behavior:'smooth', block:'end'});
  setTimeout(() => { box.querySelector('.typing')?.remove(); pushMsgs({ai:true, ...reply, t:now()}); }, delay);
}
function ask(q) { if (!q.trim()) return; pushMsgs({me:true, text:q.replace(/</g, '&lt;'), t:now()}); botReply(answer(q)); }
function sendPhoto(file) {
  const url = URL.createObjectURL(file);
  pushMsgs({me:true, img:url, text:'Photo de ma plante', t:now()});
  botReply({html:`J’ai analysé ta photo :
    <div class="diag"><b>Stress hydrique (soif)</b><br><span style="font-size:13px">Feuilles du bas qui jaunissent et s’enroulent.</span><div class="conf"><i style="width:87%"></i></div><small>Confiance : 87 %</small></div>
    <p style="margin:8px 0 0">À faire : arrose 2 verres d’eau ce soir, puis 1 verre chaque soir pendant 3 jours. Envoie une nouvelle photo samedi.</p>`}, 2200);
}

function render(focus) {
  const sc = SCREENS[state.tab];
  $('#screen-title').textContent = sc.title;
  $('#screen-sub').textContent = sc.sub;
  const main = $('#main');
  main.innerHTML = `<div class="screen">${sc.render()}</div>`;
  hydrate(main);
  document.querySelectorAll('.nav [data-tab]').forEach(b => b.dataset.tab === state.tab ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  // panier
  document.querySelector('.cartbar')?.remove();
  const n = Object.values(state.cart).reduce((a, b) => a + b, 0);
  if (state.tab === 'marche' && n) {
    const tot = Object.entries(state.cart).reduce((a, [id, q]) => a + PRODUCTS.find(p => p.id === id).prix * q, 0);
    document.body.insertAdjacentHTML('beforeend', `<button class="cartbar" id="cartbar"><span>${icon('basket', 20)} ${n} article${n > 1 ? 's' : ''}</span><span>${fcfa(tot)} · Voir le panier</span></button>`);
  }
  if (state.tab === 'coach') { const box = $('#msgs'); box.lastElementChild?.scrollIntoView({block:'end'}); bindComposer(); }
  if (focus) main.focus({preventScroll:true});
}
function go(tab, prefill) {
  state.tab = tab; history.replaceState(null, '', '#' + tab);
  window.scrollTo({top:0}); closeSheet(); render(true);
  if (prefill && tab === 'coach') { const q = $('#q'); q.value = prefill; q.focus(); }
}
function bindComposer() {
  $('#composer').addEventListener('submit', e => { e.preventDefault(); const q = $('#q'); ask(q.value); q.value = ''; });
  $('#photo').addEventListener('change', e => { const f = e.target.files[0]; if (f) sendPhoto(f); e.target.value = ''; });
  $('#mic').addEventListener('click', () => toast('Message vocal : maintenez pour parler (bientôt disponible)'));
}

document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-close]'); if (!t) return;
  const d = t.dataset;
  if ('close' in d) return closeSheet();
  if (d.tab) return go(d.tab);
  if (d.goto) return go(d.goto, d.prefill);
  if (d.openPlant) return plantSheet(d.openPlant);
  if (d.task) {
    const i = state.done.indexOf(d.task); i < 0 ? state.done.push(d.task) : state.done.splice(i, 1);
    store.set('done', state.done); t.setAttribute('aria-checked', i < 0);
    $('#task-count').textContent = `${state.done.length}/${TASKS.length} fait`;
    if (state.done.length === TASKS.length) toast('Bravo Awa et Fatou ! Toutes les tâches du jour sont faites 🎉');
    return;
  }
  if (d.water) {
    const p = PLANTS.find(x => x.id === d.water); p.humid = 46; p.histo[p.histo.length - 1] = 46;
    if (!state.done.includes('t1')) state.done.push('t1'); store.set('done', state.done);
    closeSheet(); render(); toast(`Merci ! La ${p.nom.toLowerCase()} est arrosée (46 %).`); return;
  }
  if (d.filter) { state.filtre = d.filter; return render(); }
  if (d.cat) { state.cat = d.cat; return render(); }
  if (d.lang) { state.lang = d.lang; store.set('lang', d.lang); render(); return toast(d.lang === 'wo' ? 'Les réponses arrivent aussi en note vocale wolof' : 'Réponses en français'); }
  if (d.ask) return ask(d.ask);
  if ('voice' in d) return toast('Lecture de la note vocale en wolof (démo)');
  if (d.inscrire) {
    const i = state.inscrit.indexOf(d.inscrire), w = WORKSHOPS.find(x => x.id === d.inscrire);
    i < 0 ? state.inscrit.push(d.inscrire) : state.inscrit.splice(i, 1); store.set('inscrit', state.inscrit); render();
    return toast(i < 0 ? `Inscrites ! Rappel WhatsApp la veille de « ${w.titre} »` : 'Inscription annulée');
  }
  if (d.inc) { state.cart[d.inc] = Math.min((state.cart[d.inc] || 0) + 1, PRODUCTS.find(p => p.id === d.inc).stock); store.set('cart', state.cart); return render(); }
  if (d.dec) { state.cart[d.dec]--; if (!state.cart[d.dec]) delete state.cart[d.dec]; store.set('cart', state.cart); return render(); }
  if (t.id === 'cartbar') return cartSheet();
  if (t.id === 'btn-notif') { t.querySelector('.dot')?.remove(); return notifSheet(); }
  if (t.id === 'btn-profile') return profileSheet();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (SCREENS[h] && h !== state.tab) go(h); });

/* init */
$('#btn-profile img').src = img(USER.photo, 120);
hydrate(document);
const start = location.hash.slice(1);
if (SCREENS[start]) state.tab = start;
render();
</script>
</body>
</html>
